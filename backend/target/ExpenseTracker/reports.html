<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reports - Expense Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/api.js"></script>
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <h1>💰 ExpenseTracker</h1>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="add_expense.html">Add Expense</a></li>
                    <li><a href="income.html">Income</a></li>
                    <li><a href="budgets.html">Budgets</a></li>
                    <li><a href="reports.html" class="active">Reports</a></li>
                    <li><a href="savings.html">Savings Goals</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h2>Monthly Reports</h2>
                <div class="month-selector">
                    <select id="reportMonth">
                        <option value="1">January</option>
                        <option value="2">February</option>
                        <option value="3">March</option>
                        <option value="4">April</option>
                        <option value="5">May</option>
                        <option value="6">June</option>
                        <option value="7">July</option>
                        <option value="8">August</option>
                        <option value="9">September</option>
                        <option value="10">October</option>
                        <option value="11">November</option>
                        <option value="12">December</option>
                    </select>
                    <select id="reportYear">
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
            </header>

            <!-- Report Summary -->
            <section class="summary-cards">
                <div class="card income-card">
                    <div class="card-icon">💵</div>
                    <div class="card-content">
                        <h3>Total Income</h3>
                        <p class="amount" id="reportIncome">$0.00</p>
                    </div>
                </div>
                <div class="card expense-card">
                    <div class="card-icon">💸</div>
                    <div class="card-content">
                        <h3>Total Expenses</h3>
                        <p class="amount" id="reportExpenses">$0.00</p>
                    </div>
                </div>
                <div class="card savings-card">
                    <div class="card-icon">🏦</div>
                    <div class="card-content">
                        <h3>Savings</h3>
                        <p class="amount" id="reportSavings">$0.00</p>
                    </div>
                </div>
                <div class="card savings-card">
                    <div class="card-icon">📈</div>
                    <div class="card-content">
                        <h3>Savings %</h3>
                        <p class="percentage" id="reportSavingsPercent">0%</p>
                    </div>
                </div>
            </section>

            <!-- Charts -->
            <section class="charts-section">
                <div class="chart-container">
                    <h3>Expense by Category</h3>
                    <canvas id="reportCategoryChart"></canvas>
                </div>
                <div class="chart-container">
                    <h3>Income Sources</h3>
                    <canvas id="reportIncomeChart"></canvas>
                </div>
            </section>

            <!-- Detailed Report -->
            <section class="report-section">
                <h3>Category Breakdown</h3>
                <div class="table-container">
                    <table id="reportTable">
                        <thead>
                            <tr>
                                <th>Category</th>
                                <th>Amount</th>
                                <th>Budget</th>
                                <th>% Used</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/charts.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
