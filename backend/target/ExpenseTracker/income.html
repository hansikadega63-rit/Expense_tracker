<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Income - Expense Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/api.js"></script>
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <h1>💰 ExpenseTracker</h1>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="add_expense.html">Add Expense</a></li>
                    <li><a href="income.html" class="active">Income</a></li>
                    <li><a href="budgets.html">Budgets</a></li>
                    <li><a href="reports.html">Reports</a></li>
                    <li><a href="savings.html">Savings Goals</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h2>Income Management</h2>
            </header>

            <section class="form-section">
                <form id="incomeForm" class="form-container">
                    <div class="form-group">
                        <label for="incomeAmount">Amount *</label>
                        <input type="number" id="incomeAmount" name="amount" step="0.01" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="source">Source *</label>
                        <input type="text" id="source" name="source" placeholder="e.g., Salary, Freelance, Bonus" required>
                    </div>

                    <div class="form-group">
                        <label for="incomeDate">Date *</label>
                        <input type="date" id="incomeDate" name="date" required>
                    </div>

                    <div class="form-group">
                        <label for="notes">Notes</label>
                        <textarea id="notes" name="notes" rows="4" placeholder="Additional notes"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Add Income</button>
                </form>
            </section>

            <!-- Income Summary -->
            <section class="summary-cards">
                <div class="card income-card">
                    <div class="card-icon">💵</div>
                    <div class="card-content">
                        <h3>Total Income</h3>
                        <p class="amount" id="monthlyIncome">$0.00</p>
                    </div>
                </div>
            </section>

            <!-- Income Records -->
            <section class="income-section">
                <h3>Income Records</h3>
                <div class="table-container">
                    <table id="incomeTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Source</th>
                                <th>Amount</th>
                                <th>Notes</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/income.js"></script>
</body>
</html>
