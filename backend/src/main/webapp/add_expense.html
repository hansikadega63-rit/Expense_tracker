<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Expense - Expense Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/api.js"></script>
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <h1>💰 ExpenseTracker</h1>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="add_expense.html" class="active">Add Expense</a></li>
                    <li><a href="income.html">Income</a></li>
                    <li><a href="budgets.html">Budgets</a></li>
                    <li><a href="reports.html">Reports</a></li>
                    <li><a href="savings.html">Savings Goals</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h2>Add New Expense</h2>
            </header>

            <section class="form-section">
                <form id="expenseForm" class="form-container">
                    <div class="form-group">
                        <label for="amount">Amount *</label>
                        <input type="number" id="amount" name="amount" step="0.01" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category *</label>
                        <select id="category" name="category" required>
                            <option value="">Select Category</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Rent">Rent</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="date">Date *</label>
                        <input type="date" id="date" name="date" required>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="4" placeholder="Enter expense description"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Add Expense</button>
                    <a href="index.html" class="btn btn-secondary">Cancel</a>
                </form>
            </section>

            <!-- Recent Expenses List -->
            <section class="expenses-section">
                <h3>Recent Expenses</h3>
                <div class="table-container">
                    <table id="expensesTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Category</th>
                                <th>Description</th>
                                <th>Amount</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Populated by JavaScript -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="js/expense.js"></script>
</body>
</html>
