<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savings Goals - Expense Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/api.js"></script>
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <h1>💰 ExpenseTracker</h1>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="add_expense.html">Add Expense</a></li>
                    <li><a href="income.html">Income</a></li>
                    <li><a href="budgets.html">Budgets</a></li>
                    <li><a href="reports.html">Reports</a></li>
                    <li><a href="savings.html" class="active">Savings Goals</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h2>Savings Goals</h2>
            </header>

            <section class="form-section">
                <form id="savingsGoalForm" class="form-container">
                    <div class="form-group">
                        <label for="goalName">Goal Name *</label>
                        <input type="text" id="goalName" name="name" placeholder="e.g., Emergency Fund" required>
                    </div>

                    <div class="form-group">
                        <label for="targetAmount">Target Amount *</label>
                        <input type="number" id="targetAmount" name="targetAmount" step="0.01" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="currentAmount">Current Amount *</label>
                        <input type="number" id="currentAmount" name="currentAmount" step="0.01" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="deadline">Deadline *</label>
                        <input type="date" id="deadline" name="deadline" required>
                    </div>

                    <div class="form-group">
                        <label for="priority">Priority *</label>
                        <select id="priority" name="priority" required>
                            <option value="">Select Priority</option>
                            <option value="HIGH">High</option>
                            <option value="MEDIUM">Medium</option>
                            <option value="LOW">Low</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <textarea id="description" name="description" rows="3" placeholder="Goal description"></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">Add Savings Goal</button>
                </form>
            </section>

            <!-- Savings Goals List -->
            <section class="savings-goals-section">
                <h3>Your Savings Goals</h3>
                <div id="savingsGoalsList" class="goals-container">
                    <!-- Populated by JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <script src="js/savings.js"></script>
</body>
</html>
