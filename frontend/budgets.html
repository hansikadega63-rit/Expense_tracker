<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budgets - Expense Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/api.js"></script>
</head>
<body>
    <div class="container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="logo">
                <h1>💰 ExpenseTracker</h1>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="index.html">Dashboard</a></li>
                    <li><a href="add_expense.html">Add Expense</a></li>
                    <li><a href="income.html">Income</a></li>
                    <li><a href="budgets.html" class="active">Budgets</a></li>
                    <li><a href="reports.html">Reports</a></li>
                    <li><a href="savings.html">Savings Goals</a></li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h2>Budget Management</h2>
            </header>

            <section class="form-section">
                <form id="budgetForm" class="form-container">
                    <div class="form-group">
                        <label for="budgetCategory">Category *</label>
                        <select id="budgetCategory" name="category" required>
                            <option value="">Select Category</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Rent">Rent</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="budgetAmount">Budget Amount *</label>
                        <input type="number" id="budgetAmount" name="amount" step="0.01" min="0" required>
                    </div>

                    <div class="form-group">
                        <label for="budgetMonth">Month *</label>
                        <select id="budgetMonth" name="month" required>
                            <option value="">Select Month</option>
                            <option value="1">January</option>
                            <option value="2">February</option>
                            <option value="3">March</option>
                            <option value="4">April</option>
                            <option value="5">May</option>
                            <option value="6">June</option>
                            <option value="7">July</option>
                            <option value="8">August</option>
                            <option value="9">September</option>
                            <option value="10">October</option>
                            <option value="11">November</option>
                            <option value="12">December</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="budgetYear">Year *</label>
                        <input type="number" id="budgetYear" name="year" min="2020" max="2050" required>
                    </div>

                    <button type="submit" class="btn btn-primary">Set Budget</button>
                </form>
            </section>

            <!-- Budget List -->
            <section class="budgets-section">
                <h3>Current Budgets</h3>
                <div id="budgetsList" class="budgets-container">
                    <!-- Populated by JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <script src="js/budget.js"></script>
</body>
</html>
